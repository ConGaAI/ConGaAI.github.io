        try {

          if (!saved) return;
          var baseHref = document.querySelector('base') && document.querySelector('base').href;
          var basePath = new URL(baseHref || '/', location.origin).pathname;
          if (basePath.slice(-1) !== '/') basePath += '/';
          var thisPreview = basePath.indexOf('/preview/') === 0;
          var savedPath = saved.split('?')[0].split('#')[0];
          var savedPreview = savedPath === '/preview' || savedPath.indexOf('/preview/') === 0;
          if (thisPreview !== savedPreview) return;
          sessionStorage.removeItem('pages-spa-redirect');
          history.replaceState(null, '', saved);
        } catch (error) {}
      })();
